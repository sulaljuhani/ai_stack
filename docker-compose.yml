services:
  # ===========================================================================
  # LangGraph Multi-Agent API
  # ===========================================================================
  langgraph-agents:
    build:
      context: ./containers/langgraph-agents
      dockerfile: Dockerfile
    container_name: langgraph-agents
    restart: unless-stopped
    environment:
      # API Configuration
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      API_KEY: ${API_KEY}

      # LLM Provider (OpenAI/DeepSeek/Ollama)
      LLM_PROVIDER: ${LLM_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_MODEL: ${OPENAI_MODEL}

      # Ollama LLM (for agents)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}

      # Embeddings (Ollama)
      OLLAMA_EMBED_URL: ${OLLAMA_EMBED_URL}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}

      # Database
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # Redis
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      # Qdrant
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT}

      # State Management
      STATE_PRUNING_ENABLED: ${STATE_PRUNING_ENABLED:-true}
      STATE_MAX_MESSAGES: ${STATE_MAX_MESSAGES:-20}
      STATE_TTL_SECONDS: ${STATE_TTL_SECONDS:-86400}

      # Other
      DEFAULT_USER_ID: ${DEFAULT_USER_ID}
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      VAULT_PATH: ${VAULT_PATH:-/mnt/user/data/vault}
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for live updates
      - ./containers/langgraph-agents:/app
      - ./vault:/app/vault
      - ${VAULT_PATH:-/mnt/user/data/vault}:${VAULT_PATH:-/mnt/user/data/vault}
    networks:
      - ai-stack-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # AI Stack Web UI - Custom Chat Interface
  # ===========================================================================
  ai-stack-webui:
    build:
      context: ./web/app
      dockerfile: Dockerfile
    container_name: ai-stack-webui
    restart: unless-stopped
    environment:
      # Backend API URL (internal Docker network)
      PUBLIC_BACKEND_URL: http://langgraph-agents:8000
    ports:
      - "${WEBUI_PORT:-3000}:80"
    networks:
      - ai-stack-network
    depends_on:
      - langgraph-agents
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ===========================================================================
  # Open-WebUI Adapter (OpenAI-style shim to LangGraph)
  # ===========================================================================
  openwebui-adapter:
    build:
      context: ./openwebui/adapter
      dockerfile: Dockerfile
    container_name: openwebui-adapter
    restart: unless-stopped
    environment:
      LANGGRAPH_CHAT_URL: ${LANGGRAPH_CHAT_URL:-http://langgraph-agents:8000/chat}
      LANGGRAPH_API_KEY: ${LANGGRAPH_API_KEY:-}
      LANGGRAPH_USER_ID: ${DEFAULT_USER_ID:-00000000-0000-0000-0000-000000000001}
      OPENWEBUI_ADAPTER_API_KEY: ${OPENWEBUI_ADAPTER_API_KEY:-change_me}
      LANGGRAPH_REQUEST_TIMEOUT_SECONDS: ${LANGGRAPH_REQUEST_TIMEOUT_SECONDS:-90}
      PORT: 8080
    ports:
      - "${OPENWEBUI_ADAPTER_PORT:-8090}:8080"
    networks:
      - ai-stack-network
    depends_on:
      - langgraph-agents

networks:
  ai-stack-network:
    external: true
    name: ai-stack-network
