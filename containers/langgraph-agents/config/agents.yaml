teams:
  - name: task_management
    display_name: Task Management Team
    supervisor: task_supervisor
    description: Handles all task-related operations
    keywords:
      - term: task
        weight: 2.0
      - todo
      - deadline
      - priority

  - name: event_management
    display_name: Event & Calendar Team
    supervisor: event_supervisor
    description: Calendar events, scheduling, and conflicts
    keywords:
      - term: event
        weight: 2.0
      - calendar
      - schedule
      - meeting

  - name: reminder_management
    display_name: Reminders Team
    supervisor: reminder_supervisor
    description: Reminder lifecycle management
    keywords:
      - term: reminder
        weight: 1.8
      - remind
      - alert

  - name: knowledge_management
    display_name: Knowledge & Notes Team
    supervisor: knowledge_supervisor
    description: Notes, knowledge search, and documents
    keywords:
      - term: note
        weight: 1.5
      - knowledge
      - search
      - document

  - name: life_logging
    display_name: Life Logging Team
    supervisor: logging_supervisor
    description: Dynamic logging to database tables
    keywords:
      - term: log
        weight: 1.5
      - record
      - track

  - name: analytics
    display_name: Analytics & Reporting Team
    supervisor: analytics_supervisor
    description: Data analysis and reporting
    keywords:
      - term: analyze
        weight: 2.5
      - term: report
        weight: 2.0
      - term: statistics
        weight: 1.5

  - name: integrations
    display_name: External Integrations Team
    supervisor: integration_supervisor
    description: Todoist, Google Calendar, and external services
    keywords:
      - todoist
      - google calendar
      - sync

